<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahiga Go AI</title>
  
  <!-- Conecta o site com as configurações de App Web -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">

  <style>
    :root {
      --primary: #6366f1;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
    header { text-align: center; margin-bottom: 20px; }
    
    .install-btn {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px 24px;
      border-radius: 20px;
      margin-bottom: 20px;
      cursor: pointer;
      display: none; /* Aparece apenas se o navegador permitir instalar o App */
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
    }

    .status-box { background: #334155; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; width: 100%; max-width: 400px; }
    .pricing { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; max-width: 1000px; }
    .card { background: var(--card); border: 1px solid #334155; border-radius: 12px; padding: 20px; width: 280px; text-align: center; }
    .price { font-size: 1.8rem; font-weight: bold; margin: 10px 0; }
    .btn { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>Ahiga Go AI</h1>
    <p>Acesse a inteligência artificial</p>
  </header>

  <!-- Botão para o usuário instalar o App Web -->
  <button id="btn-install" class="install-btn" onclick="instalarPWA()">📲 Instalar App no Celular</button>

  <div class="status-box" id="status">Verificando permissão...</div>

  <div class="pricing">
    <div class="card">
      <h3>Diário</h3>
      <div class="price">R$ 4,99</div>
      <button class="btn" onclick="comprar('ahiga_diario', 1)">Assinar 1 Dia</button>
    </div>

    <div class="card">
      <h3>Mensal (10% OFF)</h3>
      <div class="price">R$ 134,73</div>
      <button class="btn" onclick="comprar('ahiga_mensal', 30)">Assinar 30 Dias</button>
    </div>

    <div class="card">
      <h3>Anual (30% OFF)</h3>
      <div class="price">R$ 1.274,95</div>
      <button class="btn" onclick="comprar('ahiga_anual', 365)">Assinar 1 Ano</button>
    </div>
  </div>

  <script>
    // 1. Registra o Service Worker (necessário para ser um App Web)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('Erro no Service Worker:', err));
    }

    // 2. Lógica de instalação do App Web
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('btn-install').style.display = 'block';
    });

    function instalarPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          document.getElementById('btn-install').style.display = 'none';
          deferredPrompt = null;
        });
      }
    }

    // 3. Verifica no localStorage se a pessoa já tem dias comprados
    function checarAcesso() {
      const exp = localStorage.getItem('ahiga_acesso_ate');
      const statusEl = document.getElementById('status');
      
      if (exp && new Date().getTime() < parseInt(exp)) {
        const data = new Date(parseInt(exp)).toLocaleString('pt-BR');
        statusEl.innerHTML = ` Status: <strong>Acesso Liberado</strong> até ${data}`;
        statusEl.style.color = '#4ade80';
        return true;
      }
      statusEl.innerHTML = ' Status: <strong>Sem assinatura ativa</strong>';
      statusEl.style.color = '#f87171';
      return false;
    }

    // 4. Lógica para processar a compra pelo Google Play Billing
    const SKUS = {
      'ahiga_diario': 'ahiga_go_daily',
      'ahiga_mensal': 'ahiga_go_monthly',
      'ahiga_anual': 'ahiga_go_annual'
    };

    async function comprar(plano, dias) {
      const sku = SKUS[plano];

      // Se o App Web estiver com a API do Google Play disponível
      if ('getDigitalGoodsService' in window) {
        try {
          const service = await window.getDigitalGoodsService('https://play.google.com/billing');
          const request = new PaymentRequest([{
            supportedMethods: 'https://play.google.com/billing',
            data: { sku: sku }
          }], { total: { label: 'Total', amount: { currency: 'BRL', value: '0.00' } } });

          const response = await request.show();
          await response.complete('success');
          
          liberarAcesso(dias);
          alert('Pagamento realizado com sucesso!');
        } catch (err) {
          alert('A compra foi cancelada ou falhou.');
        }
      } else {
        // Fallback / Teste simulado
        const simular = confirm("[Modo Teste] Confirmar liberação deste plano?");
        if (simular) liberarAcesso(dias);
      }
    }

    // 5. Função que salva a data limite no localStorage
    function liberarAcesso(dias) {
      const expiraEm = new Date().getTime() + (dias * 24 * 60 * 60 * 1000);
      localStorage.setItem('ahiga_acesso_ate', expiraEm.toString());
      checarAcesso();
    }

    checarAcesso();
  </script>
</body>
</html>
