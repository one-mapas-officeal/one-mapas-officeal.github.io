<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahiga Go Life - Checkout</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">

  <style>
    :root {
      --primary: #6366f1;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
    header { text-align: center; margin-bottom: 20px; }
    
    .status-box { background: #334155; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; width: 100%; max-width: 400px; }
    .pricing { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
    .card { background: var(--card); border: 1px solid #334155; border-radius: 12px; padding: 25px; width: 300px; text-align: center; }
    .price { font-size: 2rem; font-weight: bold; margin: 10px 0; }
    .original-price { text-decoration: line-through; color: #94a3b8; font-size: 0.95rem; }
    .methods { font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; }
    .btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; text-decoration: none; display: block; }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <header>
    <h1>Ahiga Go Life</h1>
    <p>Acesse a plataforma pagando via <strong>PIX</strong> ou <strong>Cartão</strong></p>
  </header>

  <div class="status-box" id="status">Verificando permissão...</div>

  <div class="pricing">
    <!-- Plano Diário -->
    <div class="card">
      <h3>Diário</h3>
      <div class="price">R$ 30,00</div>
      <div class="methods">💳 Cartão ou 📱 PIX</div>
      <button class="btn" onclick="pagar('https://buy.stripe.com/test_14A3cncG28ar9xUaUV7AI02', 1)">Pagar R$ 30,00</button>
    </div>

    <!-- Plano Mensal -->
    <div class="card">
      <h3>Mensal (10% OFF)</h3>
      <div class="original-price">De R$ 900,00</div>
      <div class="price">R$ 810,00</div>
      <div class="methods">💳 Cartão ou 📱 PIX</div>
      <button class="btn" onclick="pagar('https://buy.stripe.com/test_9B600bbBYeyPh0mgff7AI04', 30)">Pagar R$ 810,00</button>
    </div>
  </div>

  <script>
    function checarAcesso() {
      const statusEl = document.getElementById('status');
      const urlParams = new URLSearchParams(window.location.search);
      
      if (urlParams.get('sucesso') === 'true') {
        const dias = parseInt(urlParams.get('dias') || '1');
        liberarAcesso(dias);
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      const exp = localStorage.getItem('ahiga_acesso_ate');
      if (exp && new Date().getTime() < parseInt(exp)) {
        const data = new Date(parseInt(exp)).toLocaleString('pt-BR');
        statusEl.innerHTML = ` Status: <strong>Acesso Liberado</strong> até ${data}`;
        statusEl.style.color = '#4ade80';
        return true;
      }
      
      statusEl.innerHTML = ' Status: <strong>Sem assinatura ativa</strong>';
      statusEl.style.color = '#f87171';
      return false;
    }

    function pagar(linkStripe, dias) {
      if (linkStripe.startsWith('http')) {
        const urlRetorno = encodeURIComponent(window.location.origin + window.location.pathname + `?sucesso=true&dias=${dias}`);
        window.location.href = `${linkStripe}?after_completion_url=${urlRetorno}`;
      }
    }

    function liberarAcesso(dias) {
      const expiraEm = new Date().getTime() + (dias * 24 * 60 * 60 * 1000);
      localStorage.setItem('ahiga_acesso_ate', expiraEm.toString());
      checarAcesso();
    }

    checarAcesso();
  </script>
</body>
</html>
