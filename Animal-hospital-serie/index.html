<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Hospital - Notícias</title>
<style>
  :root { --bg:#0b0b0d; --card:#16161a; --line:#2a2a31; --txt:#ececf1; --mut:#8d8d99; --red:#8b1a1a; --grn:#1f4a22; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; min-height:100vh; }
  .hidden { display:none !important; }

  /* Tela 1: seletor de idioma */
  #picker { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; padding:24px; text-align:center; }
  #picker h1 { margin:0; font-size:1.6rem; letter-spacing:.04em; }
  #picker p { margin:0; color:var(--mut); }
  .langs { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; }
  .lang { background:none; border:0; color:var(--txt); cursor:pointer; text-align:center; padding:8px; border-radius:16px; transition:transform .15s; }
  .lang:hover { transform:scale(1.06); }
  .lang img { width:200px; max-width:42vw; height:auto; display:block; }
  .lang span { display:block; margin-top:4px; font-weight:600; }

  /* Tela 2: notícias */
  header { position:sticky; top:0; z-index:5; background:rgba(11,11,13,.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; padding:10px 16px; }
  header img { height:44px; width:auto; }
  header h2 { margin:0; font-size:1.05rem; flex:1; }
  #status { font-size:.75rem; color:var(--mut); }
  #status.err { color:#e06666; }
  #back { background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:8px 12px; cursor:pointer; }
  #back:hover { border-color:var(--mut); }
  main { max-width:760px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
  article { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--red); border-radius:12px; padding:16px; }
  article.eua { border-left-color:var(--grn); }
  article .id { font-size:.72rem; color:var(--mut); margin-bottom:4px; }
  article h3 { margin:0 0 8px; font-size:1.05rem; word-break:break-word; }
  article p { margin:0; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  #empty { text-align:center; color:var(--mut); padding:40px 0; }
</style>
</head>
<body>

<!-- PRIMEIRA PÁGINA: seletor de idioma -->

<section id="news" class="hidden">
  <header>
    <img id="flag" alt="">
    <h2 id="title">Notícias</h2>
    <span id="status">…</span>
    <button id="sair" style="background:#16161a;color:#8d8d99;border:1px solid #2a2a31;border-radius:10px;padding:8px 12px;cursor:pointer">Sair</button>
    <button id="back">⟵</button>
  </header>
  <main id="list"></main>
</section>

<script>
// ====== CONFIGURAÇÃO ======
// Se quiser usar as imagens do GitHub, troque os src dos botões acima por URLs.
const LOG_URL = "https://raw.githubusercontent.com/one-mapas-officeal/one-mapas-officeal.github.io/refs/heads/main/Animal-hospital-serie/Log";
const INTERVALO_MS = 1000; // 1 segundo

// ====== ESTADO ======
let lang = null;          // "br" | "eua" | "outros"
let lastRaw = null;       // último texto recebido (para só redesenhar quando mudar)
let items = [];
let loading = false;

const $ = id => document.getElementById(id);

// ====== PARSE ROBUSTO ======
function parseLog(text) {
  text = text.replace(/^\uFEFF/, "").trim();
  if (!text) return [];
  try {
    const j = JSON.parse(text);
    return Array.isArray(j) ? j : [j];
  } catch (e) {}
  // Fallback: objetos soltos, um depois do outro (sem [ ] e/ou sem vírgulas)
  try {
    const fixed = "[" + text.replace(/}\s*,?\s*{/g, "},{").replace(/,\s*$/, "") + "]";
    return JSON.parse(fixed);
  } catch (e) {
    return null;
  }
}

// ====== BUSCA A CADA 1s ======
async function fetchLog() {
  if (loading || !lang) return;
  loading = true;
  try {
    const r = await fetch(LOG_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const raw = await r.text();
    if (raw !== lastRaw) {
      const parsed = parseLog(raw);
      if (parsed === null) throw new Error("JSON inválido");
      lastRaw = raw;
      items = parsed;
      render();
    }
    setStatus(false);
  } catch (e) {
    setStatus(true, e.message);
  } finally {
    loading = false;
  }
}

function setStatus(err, msg) {
  const s = $("status");
  s.className = err ? "err" : "";
  s.textContent = err ? ("erro: " + msg) : ("● ao vivo");
}

// ====== RENDER ======
function render() {
  const list = $("list");
  list.innerHTML = "";

  // Maior Id primeiro
  const sorted = items
    .filter(i => i && typeof i === "object")
    .slice()
    .sort((a, b) => Number(b.Id) - Number(a.Id));

  if (!sorted.length) {
    const d = document.createElement("div");
    d.id = "empty";
    d.textContent = "Nenhuma notícia ainda.";
    list.appendChild(d);
    return;
  }

  // BR usa os campos -br; EUA e "outros" usam os campos -eua
  // (em "outros" o tradutor do Chrome traduz a partir do inglês)
  const suf = lang === "br" ? "br" : "eua";

  for (const it of sorted) {
    const a = document.createElement("article");
    if (suf === "eua") a.className = "eua";

    const id = document.createElement("div");
    id.className = "id";
    id.textContent = "#" + it.Id;

    const h = document.createElement("h3");
    h.textContent = it["Name-" + suf] ?? "";

    const p = document.createElement("p");
    p.textContent = it["Conteudo-" + suf] ?? "";

    a.append(id, h, p);
    list.appendChild(a);
  }
}

// ====== NAVEGAÇÃO ======
function escolher(l) {
  lang = l;
  lastRaw = null;
  document.documentElement.lang = (l === "br") ? "pt-BR" : "en"; // ajuda o tradutor do Chrome
  $("flag").src = document.querySelector('.lang[data-lang="' + l + '"] img').src;
  $("title").textContent = l === "br" ? "Notícias" : "News";
  $("picker").classList.add("hidden");
  $("news").classList.remove("hidden");
  $("list").innerHTML = "";
  fetchLog();
}

function voltar() {
  lang = null;
  document.documentElement.lang = "pt-BR";
  $("news").classList.add("hidden");
  $("picker").classList.remove("hidden");
}

document.querySelectorAll(".lang").forEach(b => b.addEventListener("click", () => escolher(b.dataset.lang)));
$("back").addEventListener("click", voltar);
setInterval(fetchLog, INTERVALO_MS);
</script>

<script>
// ====== ATIVIDADE DO USUÁRIO -> SUPABASE ======
// Regra: 1 linha por usuário. Enquanto o usuário repete o MESMO tipo de ação,
// a linha é atualizada (acumula os eventos). Quando faz OUTRA coisa, a linha
// anterior é apagada e uma nova é criada com os novos dados.
// A configuração vem do arquivo .env na MESMA pasta deste HTML.
// ATENÇÃO: esse arquivo é público na internet. Coloque nele SÓ a URL e a
// chave pública (sb_publishable_...). NUNCA a chave secreta (sb_secret_...).
const TABELA = "atividade_usuario";
let REST = null, H = null;

// Valores embutidos: o site funciona sem servidor local (também abrindo o arquivo direto).
// São só a URL e a chave PÚBLICA. O .env, se existir na mesma pasta e puder ser lido, tem prioridade.
const PADRAO = {
  SUPABASE_URL: "https://avikiajohxjxcwsatqen.supabase.co",
  SUPABASE_PUBLISHABLE_KEY: "sb_publishable_rm2oTNR8WujID7Zyu1uhCg_z1Hp5tFY"
};

async function carregarEnv() {
  const env = Object.assign({}, PADRAO);
  try {
    const r = await fetch(".env?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) {
      for (const linha of (await r.text()).split(/\r?\n/)) {
        const m = linha.match(/^\s*([A-Za-z0-9_]+)\s*[=:]\s*(.*?)\s*$/);
        if (m) env[m[1]] = m[2].replace(/^["']|["']$/g, "");
      }
    }
  } catch (e) { /* sem .env legível (ex.: file://): usa os valores embutidos */ }
  const url = (env.SUPABASE_URL || "").replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
  const key = env.SUPABASE_PUBLISHABLE_KEY || "";
  if (!url || !key || /^sb_secret_/.test(key)) throw new Error("configuração do Supabase inválida");
  REST = url + "/rest/v1/" + TABELA;
  H = { "apikey": key, "Authorization": "Bearer " + key, "Content-Type": "application/json" };
}
const pronto = carregarEnv().catch(e => { console.warn("Supabase desativado:", e.message); });

// ID do usuário: usa ?id_google= se vier na URL; senão gera um ID anônimo
// e guarda no navegador (não precisa mais do index.html).
// O "ID" do usuário agora é o e-mail. Vem de ?id_google=<e-mail> na URL,
// ou do e-mail guardado no navegador, ou digitado na tela de login.
// (A coluna google_id do Supabase passa a guardar o e-mail.)
let GOOGLE_ID = (() => {
  const p = new URLSearchParams(location.search).get("id_google");
  if (p) {
    try { localStorage.setItem("usuario_email", p); } catch (e) {}
    return p;
  }
  try { return localStorage.getItem("usuario_email"); } catch (e) { return null; }
})();

function mostrarLogin() {
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;z-index:50;background:#0b0b0d;display:flex;align-items:center;justify-content:center;padding:24px";
  ov.innerHTML =
    '<form id="f_login" style="max-width:360px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center">' +
    '<h1 style="margin:0;font-size:1.5rem">Animal Hospital</h1>' +
    '<p style="margin:0;color:#8d8d99;font-size:.9rem">Digite seu e-mail para entrar.</p>' +
    '<input id="in_email" type="email" required autocomplete="email" placeholder="seu@email.com" ' +
    'style="padding:12px;border-radius:10px;border:1px solid #2a2a31;background:#16161a;color:#ececf1;font-size:1rem">' +
    '<button type="submit" style="padding:12px;border-radius:10px;border:0;background:#8b1a1a;color:#fff;font-size:1rem;cursor:pointer">Entrar</button>' +
    '<p id="err_email" style="margin:0;color:#e06666;font-size:.8rem;min-height:1em"></p>' +
    '<p style="margin:0;color:#8d8d99;font-size:.75rem">Ao entrar, você concorda que seu e-mail fique guardado neste navegador e que suas ações no site (cliques e rolagem) sejam registradas.</p>' +
    '</form>';
  document.body.appendChild(ov);
  document.getElementById("f_login").addEventListener("submit", ev => {
    ev.preventDefault();
    const email = document.getElementById("in_email").value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      document.getElementById("err_email").textContent = "E-mail inválido.";
      return;
    }
    GOOGLE_ID = email;
    try { localStorage.setItem("usuario_email", email); } catch (e) {}
    ov.remove(); // entra primeiro; o resto não pode travar o login
    try { history.replaceState(null, "", "?id_google=" + encodeURIComponent(email)); } catch (e) {} // falha em file://
  });
}
if (!GOOGLE_ID) mostrarLogin();

document.getElementById("sair").addEventListener("click", () => {
  try { localStorage.removeItem("usuario_email"); } catch (e) {}
  location.href = location.pathname;
});

let atual = { tipo: null, rowId: null, dados: [] };
let fila = Promise.resolve();
let timer = null;

function registrar(tipo, info) {
  if (!GOOGLE_ID) return;
  const ev = Object.assign({ t: new Date().toISOString() }, info || {});
  fila = fila.then(() => processar(tipo, ev)).catch(() => {});
}

async function processar(tipo, ev) {
  await pronto;
  if (!REST) return; // sem .env válido, não grava nada
  if (tipo !== atual.tipo || atual.rowId === null) {
    clearTimeout(timer); timer = null;
    // outra ação: apaga o que havia antes e cria uma nova linha
    await fetch(REST + "?google_id=eq." + encodeURIComponent(GOOGLE_ID), { method: "DELETE", headers: H });
    atual = { tipo, rowId: null, dados: [ev] };
    const r = await fetch(REST, {
      method: "POST",
      headers: Object.assign({ "Prefer": "return=representation" }, H),
      body: JSON.stringify({ google_id: GOOGLE_ID, tipo, dados: atual.dados })
    });
    const j = await r.json();
    atual.rowId = j && j[0] ? j[0].id : null;
  } else {
    atual.dados.push(ev);
    if (atual.dados.length > 500) atual.dados.shift(); // limite de tamanho
    clearTimeout(timer);
    timer = setTimeout(salvar, 1500); // agrupa eventos rápidos
  }
}

function salvar() {
  timer = null;
  if (atual.rowId === null) return;
  fila = fila.then(() => fetch(REST + "?id=eq." + atual.rowId, {
    method: "PATCH", headers: H,
    body: JSON.stringify({ dados: atual.dados, atualizado_em: new Date().toISOString() })
  })).catch(() => {});
}

function descrever(el) {
  return {
    tag: el.tagName, id: el.id || null,
    classe: (el.className && String(el.className).slice(0, 60)) || null,
    texto: (el.innerText || "").trim().slice(0, 80) || null
  };
}

document.addEventListener("click", e => {
  const el = e.target.closest("button, a, article, h3, p, img") || e.target;
  let tipo = "click";
  const info = Object.assign(descrever(el), { x: e.clientX, y: e.clientY, idioma: lang });
  if (el.closest(".lang")) { tipo = "idioma"; info.escolhido = el.closest(".lang").dataset.lang; }
  else if (el.closest("#back")) tipo = "voltar";
  registrar(tipo, info);
}, true);

let rolando = false;
window.addEventListener("scroll", () => {
  if (rolando) return;
  rolando = true;
  setTimeout(() => {
    rolando = false;
    registrar("scroll", { y: Math.round(window.scrollY), idioma: lang });
  }, 500);
}, { passive: true });

window.addEventListener("pagehide", () => {
  if (timer && atual.rowId !== null) {
    fetch(REST + "?id=eq." + atual.rowId, {
      method: "PATCH", headers: H, keepalive: true,
      body: JSON.stringify({ dados: atual.dados })
    });
  }
});
</script>
